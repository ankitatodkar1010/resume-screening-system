<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>
        {% block title %}
        ResumeAI
        {% endblock %}
    </title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>

        body {
            background: linear-gradient(
                135deg,
                #1f5f91,
                #4da3e8
            );

            min-height: 100vh;

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;
        }

        .main-container {
            max-width: 1400px;
            margin: auto;
            padding: 35px 25px;
        }

        .navbar-brand {
            font-size: 28px;
            font-weight: 700;
        }

        .nav-link {
            color: white !important;
            font-weight: 500;
        }

        .dashboard-card {
            border-radius: 16px;
            background: white;
        }

        .card {
            border-radius: 16px;
        }

        .btn {
            border-radius: 8px;
        }

        .page-title {
            font-weight: 700;
        }

        .section-card {
            background: white;
            border-radius: 16px;
            padding: 25px;
            box-shadow:
                0 8px 25px rgba(
                    0,
                    0,
                    0,
                    0.08
                );
        }

    </style>

</head>


<body>

<nav class="navbar navbar-expand-lg">

    <div class="container-fluid px-4">

        <a
            class="navbar-brand text-white"
            href="/dashboard"
        >
            ResumeAI
        </a>

        <div>

            <a
                class="nav-link d-inline-block px-3"
                href="/dashboard"
            >
                Dashboard
            </a>

            <a
                class="nav-link d-inline-block px-3"
                href="/history"
            >
                History
            </a>

            <a
                class="nav-link d-inline-block px-3"
                href="/logout"
            >
                Logout
            </a>

        </div>

    </div>

</nav>


<div class="main-container">

    {% block content %}

    {% endblock %}

</div>


<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>

</body>

</html>
